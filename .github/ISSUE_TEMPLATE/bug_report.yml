name: "Bug report"
description: "Report a reproducible problem in the Civic theme"
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Civic. Please provide a reproducible report.
        Do not include passwords, tokens, private addresses or personal data.
  - type: dropdown
    id: locale
    attributes:
      label: Country / locale
      options:
        - Italy (it)
        - Malta (en)
        - Malta (mt)
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: "Commit SHA, PHP/Node version, browser and host project when relevant"
      placeholder: "dev @ SHA, PHP 8.4, Chromium, FixCity"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: "Provide a minimal, repeatable sequence using non-sensitive demo data."
      placeholder: "1. Open ...\n2. Click ...\n3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and evidence
      description: "Add sanitized logs or real screenshots. Remove sensitive data."
    validations:
      required: true
